name: Construire L'Inter

# L'appli « L'Inter » (jeux de supermarché seulement, logo loup) ne se construit QUE quand on la lance à la main :
# onglet Actions > "Construire L'Inter" > Run workflow.
# Aucun déclencheur « push » ni « pull_request » : le workflow « Build APK » (build.yml) ne la construit jamais.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Vrai si le secret de signature existe (voir build.yml) : les secrets ne se lisent pas dans un « if: ».
      HAS_SIGNING: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer le JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer le SDK Android
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Rendre gradlew exécutable
        run: chmod +x gradlew

      # Pas de tests ni de lint ici : ils tournent déjà à chaque push avec « Build APK » (le code est commun).
      - name: Construire l'APK release (signé)
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          KEYSTORE_FILE="$RUNNER_TEMP/release.jks" ./gradlew assembleInterRelease --stacktrace

      - name: Construire l'APK release (non signé, secrets absents)
        if: ${{ env.HAS_SIGNING != 'true' }}
        run: ./gradlew assembleInterRelease --stacktrace

      - name: Publier l'APK de L'Inter
        if: ${{ env.HAS_SIGNING == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: "L-Inter (release)"
          path: "app/build/outputs/apk/inter/release/*.apk"
          if-no-files-found: error

      - name: Publier l'APK de L'Inter (non signé)
        if: ${{ env.HAS_SIGNING != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: "L-Inter (release non signée)"
          path: "app/build/outputs/apk/inter/release/*.apk"
          if-no-files-found: error
