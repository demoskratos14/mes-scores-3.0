name: Build APK

on:
  push:
    branches: [ main ]
  # Les pull requests (dont celles de Dependabot) sont construites et testées avant d'être fusionnées.
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Vrai si le secret de signature existe : absent pour les pull requests venant d'un fork et pour
      # Dependabot, qui n'ont pas accès aux secrets. Les secrets ne se lisent pas dans un « if: » :
      # on passe donc par cette variable.
      HAS_SIGNING: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer le JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer le SDK Android
        uses: android-actions/setup-android@v4
        with:
          # Par défaut, cette action essaie aussi d'installer le paquet "tools" (ancien outillage
          # Android retiré du dépôt Google), ce qui fait échouer l'étape. On ne demande donc que
          # platform-tools ; build-tools et platforms sont téléchargés par Gradle/AGP au besoin.
          packages: "platform-tools"

      # Pas de "gradle-version" ici : on utilise le wrapper du dépôt (Gradle 9.8.2, voir
      # gradle/wrapper/gradle-wrapper.properties), pour avoir la même version qu'en local.
      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Rendre gradlew exécutable
        run: chmod +x gradlew

      # Les tests (Tarot, règles de fin de partie, championnat) tournent avant l'APK :
      # une régression bloque le workflow au lieu de passer inaperçue.
      - name: Lancer les tests unitaires
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Publier le rapport de tests (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: "Rapport de tests"
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # Lint Android : API dépréciées, problèmes d'accessibilité, ressources inutilisées, etc.
      # Les erreurs bloquent le workflow ; les avertissements restent consultables dans le rapport.
      - name: Lancer le lint
        run: ./gradlew lintDebug --stacktrace

      - name: Publier le rapport de lint
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "Rapport de lint"
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Construire l'APK (debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Publier l'APK debug
        uses: actions/upload-artifact@v6
        with:
          name: "Mes scores (debug)"
          path: "app/build/outputs/apk/debug/Mes scores-debug.apk"
          if-no-files-found: error

      # --- Release : construite à chaque exécution, signée quand les secrets existent ---
      # La release est minifiée par R8 (isMinifyEnabled) : une règle manquante peut casser l'APK release
      # sans jamais gêner le debug. On la construit donc à chaque push, pour que le problème se voie
      # tout de suite et non au moment de publier.
      # Secrets à créer dans Settings > Secrets and variables > Actions :
      #   KEYSTORE_BASE64 (le fichier .jks encodé en base64), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      # Sans eux, la release est construite non signée : elle vérifie le build mais ne s'installe pas
      # sur un téléphone. L'AAB (bundle) est le format demandé par le Play Store ; l'APK sert aux
      # installations directes.
      - name: Construire l'APK et l'AAB (release signés)
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          KEYSTORE_FILE="$RUNNER_TEMP/release.jks" ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Construire l'APK release (non signé, secrets absents)
        if: ${{ env.HAS_SIGNING != 'true' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Publier l'APK release
        if: ${{ env.HAS_SIGNING == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: "Mes scores (release)"
          path: "app/build/outputs/apk/release/Mes scores-release.apk"
          if-no-files-found: error

      - name: Publier l'APK release non signé
        if: ${{ env.HAS_SIGNING != 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: "Mes scores (release non signée)"
          path: "app/build/outputs/apk/release/*.apk"
          if-no-files-found: error

      - name: Publier l'AAB release (Play Store)
        if: ${{ env.HAS_SIGNING == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: "Mes scores (release AAB)"
          path: "app/build/outputs/bundle/release/*.aab"
          if-no-files-found: error
