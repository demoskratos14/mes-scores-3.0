org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
# Le compilateur Kotlin tourne dans son propre processus (démon) : sans réglage il hérite de la limite ci-dessus.
# Les compilations release phone + tv (Compose) dépassaient 2 Go -> OutOfMemoryError: GC overhead limit exceeded.
kotlin.daemon.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
