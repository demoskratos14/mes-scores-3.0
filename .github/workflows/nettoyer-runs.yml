name: Nettoyer les anciens runs

# Se lance tout seul à la fin de chaque build (workflow « Build APK », fichier build.yml), et à la main :
# onglet Actions > "Nettoyer les anciens runs" > Run workflow
# (à la main, la simulation est cochée par défaut ; en automatique, les anciens runs sont vraiment supprimés)
#
# En automatique, il nettoie trois choses : les anciens runs du build (on garde les 20 derniers) et ceux des deux
# workflows de nettoyage eux-mêmes (« Nettoyer les anciens runs » et « Nettoyer les artefacts »), dont on ne garde
# que le plus récent : sinon ils s'accumulent à l'infini. Un run ne peut pas se supprimer lui-même : le run en cours
# reste, et c'est le suivant qui l'efface.
on:
  workflow_run:
    workflows: ["Build APK"]
    types: [completed]
  workflow_dispatch:
    inputs:
      garder:
        description: "Nombre de derniers runs à conserver"
        default: "20"
      workflow:
        description: "Fichier du workflow de build (vide = tous les workflows du dépôt)"
        default: "build.yml"
      simulation:
        description: "Simulation (true = n'efface rien, affiche seulement)"
        default: "true"

permissions:
  actions: write
  contents: read

# Un seul nettoyage à la fois (deux builds qui se suivent de près).
concurrency:
  group: nettoyage-runs
  cancel-in-progress: false

jobs:
  nettoyer:
    runs-on: ubuntu-latest
    steps:
      - name: Supprimer les anciens runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GARDER: ${{ inputs.garder }}
          WORKFLOW: ${{ inputs.workflow }}
          SIMULATION: ${{ inputs.simulation }}
          RUN_COURANT: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Combien de runs on garde pour chacun des deux workflows de nettoyage (le run en cours compte pour un).
          GARDER_NETTOYAGES=1

          # Supprime les anciens runs terminés d'un workflow (« tous » si le nom est vide), en gardant les $2 plus récents.
          # $3 = « oui » : s'arrêter en erreur si on ne trouve aucun run (sécurité pour le build) ; « non » : passer.
          nettoyer() {
            local workflow="$1" garder="$2" obligatoire="$3"
            local filtre=()
            if [ -n "$workflow" ]; then filtre=(--workflow "$workflow"); fi

            echo "== Workflow : ${workflow:-tous}, on garde les $garder plus récents"

            # Runs du plus récent au plus ancien (1000 max par appel)
            gh run list -R "$REPO" "${filtre[@]}" --limit 1000 \
              --json databaseId,status > runs.json

            local total
            total=$(jq length runs.json)
            if [ "$total" -eq 0 ]; then
              if [ "$obligatoire" = "oui" ]; then
                echo "Aucun run trouvé : arrêt par sécurité, rien n'est supprimé."
                exit 1
              fi
              echo "Aucun run trouvé : rien à faire."
              return 0
            fi
            echo "Runs trouvés : $total"

            # On saute les N plus récents, on ne touche qu'aux runs terminés
            # et jamais au run en cours de ce nettoyage.
            jq -r --argjson n "$garder" --arg courant "$RUN_COURANT" \
              '.[$n:] | .[] | select(.status == "completed") | select((.databaseId|tostring) != $courant) | .databaseId' \
              runs.json > a_supprimer.txt

            local supprimes=0 id
            while read -r id; do
              if [ "$SIMULATION" = "true" ]; then
                echo "[simulation] supprimerait le run $id"
              else
                gh run delete "$id" -R "$REPO" > /dev/null
                echo "supprimé : run $id"
              fi
              supprimes=$((supprimes + 1))
            done < a_supprimer.txt

            echo "Runs supprimés (ou à supprimer en simulation) : $supprimes"
          }

          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            # Lancement automatique (après chaque build) : vraie suppression.
            SIMULATION="false"
            nettoyer "build.yml" 20 oui
            nettoyer "nettoyer-runs.yml" "$GARDER_NETTOYAGES" non
            nettoyer "nettoyer-artefacts.yml" "$GARDER_NETTOYAGES" non
          else
            # Lancement à la main : un seul workflow (ou tous si le champ est vide), comme avant.
            nettoyer "$WORKFLOW" "$GARDER" oui
          fi
